<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Capture edges versus missing packets</title>
  <desc id="desc">A response at the open and a request at the close are in-flight. Unmatched rows in the middle sit next to TCP gaps.</desc>
  <rect width="960" height="240" rx="16" fill="#f6f3ee"/>
  <text x="24" y="34" font-family="Georgia, 'Iowan Old Style', serif" font-size="18" fill="#1c2430">What an unmatched packet means</text>

  <line x1="48" y1="128" x2="912" y2="128" stroke="#1c2430" stroke-width="2"/>
  <polygon points="912,128 900,122 900,134" fill="#1c2430"/>
  <text x="48" y="154" font-family="ui-sans-serif, Helvetica, sans-serif" font-size="12" fill="#5c6670">t = 0</text>
  <text x="860" y="154" font-family="ui-sans-serif, Helvetica, sans-serif" font-size="12" fill="#5c6670">file ends</text>

  <rect x="48" y="96" width="70" height="32" rx="6" fill="#24576e"/>
  <text x="83" y="116" text-anchor="middle" font-family="ui-sans-serif, Helvetica, sans-serif" font-size="11" fill="#fff">response</text>
  <text x="83" y="78" text-anchor="middle" font-family="ui-sans-serif, Helvetica, sans-serif" font-size="12" fill="#24576e">opened mid-flight</text>

  <g font-family="ui-sans-serif, Helvetica, sans-serif" font-size="11" fill="#c45c26">
    <circle cx="280" cy="128" r="7" fill="#c45c26"/>
    <circle cx="420" cy="128" r="7" fill="#c45c26"/>
    <circle cx="560" cy="128" r="7" fill="#c45c26"/>
    <circle cx="690" cy="128" r="7" fill="#c45c26"/>
  </g>
  <text x="485" y="78" text-anchor="middle" font-family="ui-sans-serif, Helvetica, sans-serif" font-size="12" fill="#c45c26">interior: request or response missing</text>
  <text x="485" y="188" text-anchor="middle" font-family="ui-sans-serif, Helvetica, sans-serif" font-size="12" fill="#5c6670">same stream, TCP lost-segment nearby, almost no retransmits</text>

  <rect x="800" y="96" width="70" height="32" rx="6" fill="#1c2430"/>
  <text x="835" y="116" text-anchor="middle" font-family="ui-sans-serif, Helvetica, sans-serif" font-size="11" fill="#fff">request</text>
  <text x="835" y="78" text-anchor="middle" font-family="ui-sans-serif, Helvetica, sans-serif" font-size="12" fill="#1c2430">closed mid-flight</text>

  <text x="24" y="220" font-family="ui-sans-serif, Helvetica, sans-serif" font-size="12" fill="#5c6670">The in-flight window is the longest matched round trip. A row farther inside than that is not the file opening or closing.</text>
</svg>
