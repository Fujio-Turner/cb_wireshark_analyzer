<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capture report</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c2430;
      --muted: #5c6670;
      --paper: #f6f3ee;
      --card: #fff;
      --line: #e4ddd2;
      --accent: #c45c26;
      --teal: #24576e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.45 ui-sans-serif, Helvetica, sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      padding: 12px 22px 10px;
      background: #1c2430;
      color: #f6f3ee;
    }
    .head-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font: 22px/1.2 Georgia, "Iowan Old Style", serif;
      font-weight: normal;
    }
    header p { margin: 2px 0 0; color: #c5d0d6; font-size: 13px; }
    .nav-corner {
      margin-left: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .nav-corner .repo {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #f6f3ee;
      font-size: 13px;
      text-decoration: none;
    }
    .nav-corner .repo:hover { text-decoration: underline; }
    .nav-corner .version { color: #c5d0d6; font-size: 12px; }
    .jump { display: flex; flex-wrap: wrap; gap: 6px; }
    .jump a {
      padding: 4px 10px;
      border: 1px solid #3d4c5c;
      border-radius: 999px;
      color: #f6f3ee;
      font-size: 13px;
      text-decoration: none;
    }
    .jump a:hover,
    .jump a.on { background: #f6f3ee; color: #1c2430; border-color: #f6f3ee; }
    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 18px;
    }
    .files {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
    }
    .files a {
      color: #c5d0d6;
      font-size: 13px;
      text-decoration: none;
    }
    .files a:hover { color: #fff; text-decoration: underline; }
    main { max-width: 860px; margin: 0 auto; padding: 22px 16px 48px; }
    #status { margin: 0 0 12px; color: var(--accent); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 22px 22px;
    }
    .prose h1, .prose h2, .prose h3 {
      font-family: Georgia, "Iowan Old Style", serif;
      font-weight: normal;
      line-height: 1.25;
    }
    .prose h1 { margin: 18px 0 8px; font-size: 28px; }
    .prose h2 { margin: 22px 0 8px; font-size: 20px; }
    .prose h3 { margin: 18px 0 6px; font-size: 17px; }
    .prose p { margin: 8px 0; }
    .prose ul, .prose ol { margin: 8px 0; padding-left: 22px; }
    .prose li { margin: 4px 0; }
    .prose a { color: var(--teal); }
    .prose code {
      padding: 0 4px;
      border-radius: 4px;
      background: var(--paper);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.92em;
    }
    .prose pre {
      overflow-x: auto;
      padding: 12px;
      border-radius: 8px;
      background: #1c2430;
      color: #f6f3ee;
    }
    .prose pre code { padding: 0; background: transparent; color: inherit; }
    .prose table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 12px 0; }
    .prose th, .prose td {
      text-align: left;
      padding: 6px 8px;
      border-top: 1px solid var(--line);
      vertical-align: top;
      word-break: break-word;
    }
    .prose th { color: var(--muted); font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="head-row">
      <div>
        <h1>Capture report</h1>
        <p id="subtitle">Loading the note</p>
      </div>
      <div class="nav-corner">
        <a class="repo" href="https://github.com/Fujio-Turner/cb_wireshark_analyzer" target="_blank" rel="noopener noreferrer">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          cb_wireshark_analyzer
        </a>
        <span class="version" id="app-version">v0.7.0</span>
      </div>
    </div>
    <div class="bar">
      <nav class="jump" aria-label="Report">
        <a href="index.html">Charts</a>
        <a id="link-summary" href="summary.html">summary.md</a>
        <a id="link-computed" href="summary.html?note=summary.computed.md" hidden>summary.computed.md</a>
      </nav>
      <nav class="files" aria-label="Report files">
        <a href="charts.json" target="_blank" rel="noopener noreferrer">charts.json</a>
      </nav>
    </div>
  </header>
  <main>
    <p id="status"></p>
    <article id="note" class="card prose"></article>
  </main>
  <script>
    const notes = ["summary.md", "summary.computed.md"];

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function inline(value) {
      let text = escapeHtml(value);
      text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
      text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      text = text.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
      text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      return text;
    }

    function isList(line) {
      return /^\s*(?:[-*]|\d+\.)\s+/.test(line);
    }

    function isRule(line) {
      return /^\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?$/.test(line.trim());
    }

    function splitRow(line) {
      return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
    }

    function tableHtml(headers, rows) {
      const head = "<tr>" + headers.map((cell) => "<th>" + inline(cell) + "</th>").join("") + "</tr>";
      const body = rows.map((row) => "<tr>" + row.map((cell) => "<td>" + inline(cell) + "</td>").join("") + "</tr>").join("");
      return "<table>" + head + body + "</table>";
    }

    function renderMarkdown(source) {
      const lines = String(source).replaceAll("\r\n", "\n").replaceAll("\r", "\n").split("\n");
      const blocks = [];
      let index = 0;
      while (index < lines.length) {
        const line = lines[index];
        if (!line.trim()) {
          index += 1;
          continue;
        }
        if (line.trim().startsWith("```")) {
          const fence = [];
          index += 1;
          while (index < lines.length && !lines[index].trim().startsWith("```")) {
            fence.push(lines[index]);
            index += 1;
          }
          if (index < lines.length) index += 1;
          blocks.push("<pre><code>" + escapeHtml(fence.join("\n")) + "</code></pre>");
          continue;
        }
        const heading = /^(#{1,3})\s+(.*)$/.exec(line);
        if (heading) {
          const level = heading[1].length;
          blocks.push("<h" + level + ">" + inline(heading[2]) + "</h" + level + ">");
          index += 1;
          continue;
        }
        if (line.trim().startsWith("|") && index + 1 < lines.length && isRule(lines[index + 1])) {
          const headers = splitRow(line);
          index += 2;
          const rows = [];
          while (index < lines.length && lines[index].trim().startsWith("|")) {
            rows.push(splitRow(lines[index]));
            index += 1;
          }
          blocks.push(tableHtml(headers, rows));
          continue;
        }
        if (isList(line)) {
          const items = [];
          while (index < lines.length && (isList(lines[index]) || (!lines[index].trim() && index + 1 < lines.length && isList(lines[index + 1])))) {
            if (!lines[index].trim()) {
              index += 1;
              continue;
            }
            items.push(lines[index].replace(/^\s*(?:[-*]|\d+\.)\s+/, ""));
            index += 1;
          }
          blocks.push("<ul>" + items.map((item) => "<li>" + inline(item) + "</li>").join("") + "</ul>");
          continue;
        }
        const paragraph = [line];
        index += 1;
        while (index < lines.length && lines[index].trim() && !/^(#{1,3})\s+/.test(lines[index]) && !lines[index].trim().startsWith("```") && !isList(lines[index]) && !(lines[index].trim().startsWith("|") && index + 1 < lines.length && isRule(lines[index + 1]))) {
          paragraph.push(lines[index]);
          index += 1;
        }
        blocks.push("<p>" + inline(paragraph.join(" ")) + "</p>");
      }
      return blocks.join("\n");
    }

    function chosenNote() {
      const name = new URLSearchParams(location.search).get("note") || "summary.md";
      return notes.includes(name) ? name : "summary.md";
    }

    function loadNote(name) {
      return fetch(name, { cache: "no-store" }).then((response) => {
        if (!response.ok) throw new Error(name + " returned " + response.status);
        return response.text();
      });
    }

    const current = chosenNote();
    document.getElementById("link-summary").classList.toggle("on", current === "summary.md");
    document.getElementById("link-computed").classList.toggle("on", current === "summary.computed.md");
    loadNote("summary.computed.md")
      .then(() => { document.getElementById("link-computed").hidden = false; })
      .catch(() => {});
    loadNote(current)
      .then((text) => {
        document.getElementById("subtitle").textContent = current;
        document.title = "Capture report: " + current;
        document.getElementById("note").innerHTML = renderMarkdown(text);
      })
      .catch((error) => {
        const message = error && error.message ? error.message : String(error);
        document.getElementById("status").textContent = message.indexOf("summary") === -1
          ? message
          : "Could not read " + current + " beside this page. From the report folder run: python3 -m http.server";
      });
  </script>
</body>
</html>
